<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#112240" />
    </linearGradient>
    <linearGradient id="box-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#3A506B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background (Rounded Square) -->
  <rect width="512" height="512" rx="110" fill="url(#bg-gradient)" />

  <!-- Center Graphic Group -->
  <g transform="translate(256, 266)">
    <!-- Digital Nodes/Shield behind -->
    <circle cx="0" cy="0" r="160" fill="#1C2541" opacity="0.5" />
    <circle cx="0" cy="0" r="160" fill="none" stroke="#47A8BD" stroke-width="4" stroke-dasharray="10 10" opacity="0.6" />

    <!-- Ballot Paper -->
    <rect x="-70" y="-150" width="140" height="170" rx="10" fill="#F8FAFC" />

    <!-- Checkmark -->
    <path d="M-30 -65 L-5 -35 L40 -95" stroke="#10B981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />

    <!-- Paper lines -->
    <line x1="-35" y1="-5" x2="35" y2="-5" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round" />
    <line x1="-35" y1="18" x2="15" y2="18" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round" />

    <!-- Ballot Box Base -->
    <path d="M-115 -25 L115 -25 L125 105 Q125 125 105 125 L-105 125 Q-125 125 -125 105 Z" fill="url(#box-gradient)" />

    <!-- Box Top Edge / Slot -->
    <rect x="-125" y="-25" width="250" height="28" rx="14" fill="#47A8BD" />

    <!-- Inner Slot -->
    <rect x="-50" y="-17" width="100" height="12" rx="6" fill="#0B132B" opacity="0.8" />
  </g>
</svg>