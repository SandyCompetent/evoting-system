<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#112240" />
    </linearGradient>
    <linearGradient id="box-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#3A506B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg-gradient)" />

  <!-- Subtle background digital grid pattern -->
  <g stroke="#1C2541" stroke-width="2" opacity="0.4">
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
  </g>

  <!-- Center Logo Group -->
  <g transform="translate(640, 260)">
    <!-- Digital Nodes/Shield behind -->
    <circle cx="0" cy="0" r="140" fill="#1C2541" opacity="0.5" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="#47A8BD" stroke-width="3" stroke-dasharray="8 8" opacity="0.6" />

    <!-- Outer decorative ring -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="#3A506B" stroke-width="1" opacity="0.5" />
    <circle cx="0" cy="-170" r="4" fill="#47A8BD" />
    <circle cx="0" cy="170" r="4" fill="#47A8BD" />
    <circle cx="170" cy="0" r="4" fill="#47A8BD" />
    <circle cx="-170" cy="0" r="4" fill="#47A8BD" />

    <!-- Ballot Paper -->
    <rect x="-60" y="-130" width="120" height="150" rx="8" fill="#F8FAFC" />

    <!-- Checkmark -->
    <path d="M-25 -55 L-5 -30 L35 -80" stroke="#10B981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />

    <!-- Paper lines -->
    <line x1="-30" y1="-5" x2="30" y2="-5" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" />
    <line x1="-30" y1="15" x2="10" y2="15" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" />

    <!-- Ballot Box Base -->
    <path d="M-100 -20 L100 -20 L110 90 Q110 110 90 110 L-90 110 Q-110 110 -110 90 Z" fill="url(#box-gradient)" />

    <!-- Box Top Edge / Slot -->
    <rect x="-110" y="-20" width="220" height="24" rx="12" fill="#47A8BD" />

    <!-- Inner Slot -->
    <rect x="-45" y="-14" width="90" height="8" rx="4" fill="#0B132B" opacity="0.8" />
  </g>

  <!-- Typography -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <text x="640" y="490" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="8">E-VOTING SYSTEM</text>
    <text x="640" y="540" font-size="22" font-weight="500" fill="#47A8BD" letter-spacing="6">SECURE • TRANSPARENT • DIGITAL</text>
  </g>
</svg>